name: Tests

on:
  push:
  pull_request:
  schedule:
    # Every Sunday at 06:00 UTC
    - cron: "0 6 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: pytest (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        backend: [tensorflow, jax, torch]

    env:
      KERAS_BACKEND: ${{ matrix.backend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache testmon database
        uses: actions/cache@v4
        with:
          path: .testmondata
          key: >
            testmon-${{ runner.os }}-${{ matrix.backend }}-${{ github.ref_name }}
          restore-keys: |
            testmon-${{ runner.os }}-${{ matrix.backend }}-

      - name: Install package
        run: pip install -e .

      - name: Install PyTorch (CPU wheels; also the weight-port reference impl)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install TensorFlow backend
        if: matrix.backend == 'tensorflow'
        run: pip install tensorflow-cpu

      - name: Install JAX backend
        if: matrix.backend == 'jax'
        run: pip install "jax[cpu]"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run incremental tests (push/PR)
        if: github.event_name != 'schedule'
        run: |
          pytest --testmon -m "not pretrained" -v

      - name: Run full test suite (scheduled)
        if: github.event_name == 'schedule'
        run: |
          pytest -m "not pretrained" -v
